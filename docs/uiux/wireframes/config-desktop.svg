<text x="272" y="599" font-size="12" fill="#555" text-anchor="start" font-weight="normal">推し (案 A) の 3 項目。案 B なら「判定の板の位置を戻す」「手元の島を消す」が下に並ぶ</text>
<text x="1268" y="710" font-size="11" fill="#888" text-anchor="end" font-weight="normal">config-desktop 1280x720</text>
