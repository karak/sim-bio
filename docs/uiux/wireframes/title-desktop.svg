<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Hiragino Sans, Noto Sans JP, system-ui, sans-serif">
<title>タイトル (デスクトップ)</title>
<rect width="1280" height="720" fill="#f2f2f2"/>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#ddd" stroke="#bbb" stroke-width="1.5"/>
<path d="M0 0L1280 720M1280 0L0 720" stroke="#bbb" stroke-width="1"/>
<text x="880" y="460" font-size="14" fill="#888" text-anchor="middle" font-weight="normal">背景のデモ (島・月鹿の群れ・海。操作できない)</text>
<rect x="0" y="0" width="470" height="720" fill="#222" fill-opacity="0.55"/>
<rect x="64" y="72" width="340" height="130" rx="2" fill="#888" stroke="#222" stroke-width="1.5"/>
<text x="234.0" y="135.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">ロゴ (石板と動物の紋)</text>
<text x="234.0" y="155.0" font-size="12" fill="#ddd" text-anchor="middle" font-weight="normal">沈みゆく島の命を、見守る</text>
<rect x="64" y="260" width="300" height="52" rx="6" fill="#555" stroke="#222" stroke-width="2"/>
<text x="80" y="284.6" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">続きから</text>
<text x="80" y="302.6" font-size="12" fill="#ddd" text-anchor="start" font-weight="normal">自由モード · 12 年 · 10/04 18:40</text>
<rect x="64" y="322" width="300" height="52" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="80" y="353.6" font-size="16" fill="#222" text-anchor="start" font-weight="normal">新規ゲーム</text>
<rect x="64" y="384" width="300" height="52" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="80" y="415.6" font-size="16" fill="#222" text-anchor="start" font-weight="normal">ロード</text>
<rect x="64" y="446" width="300" height="52" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="80" y="477.6" font-size="16" fill="#222" text-anchor="start" font-weight="normal">港</text>
<rect x="64" y="508" width="300" height="52" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="80" y="539.6" font-size="16" fill="#222" text-anchor="start" font-weight="normal">コンフィグ</text>
<text x="64" y="594" font-size="12" fill="#ddd" text-anchor="start" font-weight="normal">↑↓ で選ぶ · Enter で決める</text>
<text x="64" y="690" font-size="11" fill="#bbb" text-anchor="start" font-weight="normal">v0.x · 港: 押すまで問い合わせない</text>
<rect x="500" y="290" width="426" height="24" rx="2" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="508" y="305" font-size="12" fill="#555" text-anchor="start" font-weight="normal">既定 (フォーカス): 続きがあれば「続きから」、無ければ「新規ゲーム」</text>
<rect x="500" y="330" width="335" height="24" rx="2" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="508" y="345" font-size="12" fill="#555" text-anchor="start" font-weight="normal">「続きから」は続きが無いときは出さない (4 行になる)</text>
<rect x="500" y="610" width="449" height="24" rx="2" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="508" y="625" font-size="12" fill="#555" text-anchor="start" font-weight="normal">背景の主役は右 2/3。メニューの左 1/3 には暗い帯 (0.55 以上)</text>
<rect x="500" y="650" width="346" height="24" rx="2" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="508" y="665" font-size="12" fill="#555" text-anchor="start" font-weight="normal">prefers-reduced-motion なら止めた絵</text>
<text x="1268" y="710" font-size="11" fill="#888" text-anchor="end" font-weight="normal">title-desktop 1280x720</text>
</svg>
