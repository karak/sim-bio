<rect x="750" y="364" width="110" height="36" rx="0" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="805.0" y="388" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">10x</text>
<line x1="264" y1="434" x2="1016" y2="434" stroke="#ddd"/>
<text x="264" y="488" font-size="13" fill="#888" text-anchor="start" font-weight="normal">変えた値はその場で保存し、次の起動でも戻る</text>
<rect x="264" y="520" width="200" height="44" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
