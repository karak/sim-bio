name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # pnpm の版は package.json の packageManager から読む。setup-node の cache: pnpm より前に置く
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + lint + 単体テスト。通し実行 (npm run test:slow、約 15〜20 分) は CI では走らせない (README 参照)
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      # ビルドを wrangler dev (ローカルの workerd) で配り、本物のログの受け口に当てる (M19-02)
      - run: pnpm run test:e2e:cloudflare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
