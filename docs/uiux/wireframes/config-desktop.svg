<text x="915.0" y="196" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">きれい</text>
<line x1="264" y1="242" x2="1016" y2="242" stroke="#ddd"/>
<text x="264" y="286" font-size="17" fill="#222" text-anchor="start" font-weight="bold">動きを減らす</text>
<text x="264" y="310" font-size="12" fill="#888" text-anchor="start" font-weight="normal">背景の動き・ピンの揺れ</text>
<rect x="640" y="268" width="110" height="36" rx="0" fill="#555" stroke="#888" stroke-width="1.5"/>
