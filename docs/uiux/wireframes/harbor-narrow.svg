<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Hiragino Sans, Noto Sans JP, system-ui, sans-serif">
<title>港 (タイトルから、狭い画面)</title>
<rect width="390" height="844" fill="#f2f2f2"/>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#fff" stroke-width="1.5"/>
<text x="16" y="44" font-size="22" fill="#222" text-anchor="start" font-weight="bold">港</text>
<text x="52" y="44" font-size="12" fill="#888" text-anchor="start" font-weight="normal">流れ着いた島の年代記</text>
<rect x="278" y="18" width="96" height="36" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="294" y="40.9" font-size="14" fill="#222" text-anchor="start" font-weight="normal">閉じる</text>
<rect x="16" y="76" width="358" height="150" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32" y="108" font-size="12" fill="#888" text-anchor="start" font-weight="normal">空のとき</text>
<text x="32" y="134" font-size="13" fill="#222" text-anchor="start" font-weight="normal">まだ誰の年代記も流れ着いていない。</text>
<text x="32" y="156" font-size="13" fill="#222" text-anchor="start" font-weight="normal">石板の判定のあとに、自分の島を港へ出せる</text>
<rect x="32" y="172" width="200" height="40" rx="6" fill="#555" stroke="#222" stroke-width="2"/>
<text x="48" y="196.9" font-size="14" fill="#fff" text-anchor="start" font-weight="bold">石板を選ぶ</text>
<text x="16" y="254" font-size="12" fill="#888" text-anchor="start" font-weight="normal">開いているとき</text>
<rect x="16" y="266" width="358" height="120" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="32" y="294" font-size="16" fill="#222" text-anchor="start" font-weight="bold">灯る入り江の島</text>
<text x="32" y="316" font-size="13" fill="#555" text-anchor="start" font-weight="normal">「星を見上げた」</text>
<text x="32" y="336" font-size="11" fill="#888" text-anchor="start" font-weight="normal">『沈む欠片』を越えた · 確かめた人 3</text>
<rect x="32" y="344" width="120" height="34" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="48" y="365.55" font-size="13" fill="#222" text-anchor="start" font-weight="normal">訪れる</text>
<rect x="16" y="398" width="358" height="120" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="32" y="426" font-size="16" fill="#222" text-anchor="start" font-weight="bold">白い砂の島</text>
<text x="32" y="448" font-size="13" fill="#555" text-anchor="start" font-weight="normal">「ここで終わる」</text>
<text x="32" y="468" font-size="11" fill="#888" text-anchor="start" font-weight="normal">『空の舟』で次の島へ逃れた</text>
<rect x="32" y="476" width="120" height="34" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="48" y="497.55" font-size="13" fill="#222" text-anchor="start" font-weight="normal">訪れる</text>
<rect x="16" y="530" width="358" height="120" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="32" y="558" font-size="16" fill="#222" text-anchor="start" font-weight="bold">霧の岬の島</text>
<text x="32" y="580" font-size="13" fill="#555" text-anchor="start" font-weight="normal">「また来る」</text>
<text x="32" y="600" font-size="11" fill="#888" text-anchor="start" font-weight="normal">『火の山の目覚め』で滅んだ</text>
<rect x="32" y="608" width="120" height="34" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="48" y="629.55" font-size="13" fill="#222" text-anchor="start" font-weight="normal">訪れる</text>
<rect x="16" y="668" width="245" height="23" rx="2" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="24" y="682" font-size="11" fill="#555" text-anchor="start" font-weight="normal">押すまで港に問い合わせない (M19-09)</text>
<text x="378" y="834" font-size="11" fill="#888" text-anchor="end" font-weight="normal">harbor-narrow 390x844</text>
</svg>
