name: Deploy (Cloudflare)

# 配備は人が Actions の画面から「Run workflow」で起こすときだけ。main への push では走らせない (M19-02)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # 「Run workflow」は branch を選べる。レビュー前の branch を出さないよう main だけにする。
    # Secrets は Environment production に置き、その Deployment branches も main だけにする (README「Cloudflare へ配る」)
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # glb・png は git LFS。lfs: true が無いと、ポインタの文字列を配ってしまう
      - uses: actions/checkout@v4
        with:
          lfs: true
      # pnpm の版は package.json の packageManager から読む。setup-node の cache: pnpm より前に置く
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build:cloudflare
      # トークンは GitHub Secrets にだけ置く (README「Cloudflare へ配る」)
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
