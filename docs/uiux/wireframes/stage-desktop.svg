<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Hiragino Sans, Noto Sans JP, system-ui, sans-serif">
<title>操作画面のタイトルへ (デスクトップ)</title>
<rect width="1280" height="720" fill="#f2f2f2"/>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#ddd" stroke="#bbb" stroke-width="1.5"/>
<path d="M0 0L1280 720M1280 0L0 720" stroke="#bbb" stroke-width="1"/>
<text x="640.0" y="360.0" font-size="14" fill="#888" text-anchor="middle" font-weight="normal">操作画面 (いまの作り。島の 3D の地図)</text>
<rect x="12" y="12" width="300" height="92" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="24" y="36" font-size="12" fill="#888" text-anchor="start" font-weight="normal">時間の箱 (年・速さの列・3D で見る)</text>
<rect x="24" y="58" width="120" height="34" rx="6" fill="#555" stroke="#222" stroke-width="2"/>
<text x="40" y="79.55" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">≡ タイトルへ</text>
<rect x="440" y="12" width="400" height="120" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="640" y="76" font-size="13" fill="#888" text-anchor="middle" font-weight="normal">石板 (Tablet)</text>
<rect x="1000" y="12" width="268" height="260" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="1134" y="140" font-size="13" fill="#888" text-anchor="middle" font-weight="normal">HUD (層・枠・介入)</text>
<rect x="0" y="300" width="48" height="120" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="24" y="366" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">港</text>
<rect x="380" y="300" width="520" height="300" fill="#222" fill-opacity="0.55"/>
<rect x="420" y="330" width="440" height="230" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="444" y="364" font-size="12" fill="#888" text-anchor="start" font-weight="normal">確かめ (判定の出た島のときだけ。いまの leave の板)</text>
<text x="444" y="396" font-size="18" fill="#222" text-anchor="start" font-weight="bold">判定の出た島を離れる</text>
<text x="444" y="424" font-size="13" fill="#888" text-anchor="start" font-weight="normal">判定の出た島を離れますか。枠へ保存していなければ、</text>
<text x="444" y="446" font-size="13" fill="#888" text-anchor="start" font-weight="normal">この島には戻れません (港へ出す島は港に残ります)</text>
<rect x="444" y="476" width="190" height="48" rx="6" fill="#555" stroke="#222" stroke-width="2"/>
<text x="460" y="505.25" font-size="15" fill="#fff" text-anchor="start" font-weight="bold">離れる</text>
<rect x="650" y="476" width="190" height="48" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="666" y="505.25" font-size="15" fill="#222" text-anchor="start" font-weight="normal">やめる</text>
<rect x="330" y="640" width="415" height="24" rx="2" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="338" y="655" font-size="12" fill="#555" text-anchor="start" font-weight="normal">走っている島は確かめない (書き切ってから移る)。訪問中は何も書かない</text>
<text x="1268" y="710" font-size="11" fill="#888" text-anchor="end" font-weight="normal">stage-desktop 1280x720</text>
</svg>
