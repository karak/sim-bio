<text x="640.0" y="360.0" font-size="14" fill="#888" text-anchor="middle" font-weight="normal"></text>
<rect x="0" y="0" width="1280" height="720" fill="#222" fill-opacity="0.55"/>
<rect x="240" y="80" width="800" height="560" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
