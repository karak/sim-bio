<rect x="860" y="268" width="110" height="36" rx="0" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="915.0" y="292" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">切</text>
<line x1="264" y1="338" x2="1016" y2="338" stroke="#ddd"/>
<text x="264" y="382" font-size="17" fill="#222" text-anchor="start" font-weight="bold">最初の速さ</text>
<text x="264" y="406" font-size="12" fill="#888" text-anchor="start" font-weight="normal">島を開いたときの速さ (いまは 1x)</text>
<rect x="640" y="364" width="110" height="36" rx="0" fill="#555" stroke="#888" stroke-width="1.5"/>
