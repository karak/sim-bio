<text x="264" y="214" font-size="12" fill="#888" text-anchor="start" font-weight="normal">観察画面の影・草・解像度</text>
<rect x="640" y="172" width="110" height="36" rx="0" fill="#555" stroke="#888" stroke-width="1.5"/>
<text x="695.0" y="196" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal">自動</text>
<rect x="750" y="172" width="110" height="36" rx="0" fill="#fff" stroke="#888" stroke-width="1.5"/>
